name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: exportercreator

      - uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-collector-contrib
          path: opentelemetry-collector-contrib
          ref: main

      - uses: actions/setup-go@v5
        with:
          go-version-file: exportercreator/go.mod
          cache-dependency-path: exportercreator/go.sum

      - name: Verify module builds
        working-directory: exportercreator
        run: go build ./...

      - name: Run tests
        working-directory: exportercreator
        run: go test ./...

      - name: Request pkg.go.dev indexing
        run: |
          GOPROXY=https://proxy.golang.org GO111MODULE=on \
            go list -m github.com/stuart23/exportercreator@${GITHUB_REF_NAME}
