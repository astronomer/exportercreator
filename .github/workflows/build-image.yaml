# Builds a collector image containing exporter_creator as built from this checkout, and pushes
# it to GHCR. Manual only: this is for trying a branch in a real collector, not part of CI.
#
# The package is created on the first successful run. This repository is public, so that package
# is created public too, and GITHUB_TOKEN cannot change it. To keep the image private, set the
# package to Private once, under Packages > exportercreator/otelcol > Package settings. Later
# pushes keep whatever visibility the package already has.
name: Build and push image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: <branch>-<short sha>)"
        required: false
        type: string
      platforms:
        description: Platforms to build for
        required: false
        default: linux/amd64
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/otelcol

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          # Via the environment rather than interpolated into the script, so the input cannot
          # be read as shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            # Slashes are legal in a ref but not in a tag.
            branch="${GITHUB_REF_NAME//\//-}"
            tag="${branch}-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE:$tag"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build first without pushing, so a broken image is never published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A collector that cannot list its own components is not worth pushing, and this is what
      # catches exporter_creator failing to register.
      - name: Verify exporter_creator is in the image
        run: |
          components=$(docker run --rm "$IMAGE:${{ steps.tag.outputs.tag }}" components)
          echo "$components"
          echo "$components" | grep -q 'exporter_creator' \
            || { echo "::error::exporter_creator missing from the built collector"; exit 1; }

      # Layers are cached from the build above, so this is a push rather than a rebuild.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed \`$IMAGE:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull $IMAGE:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
